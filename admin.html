<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>后台管理 - 超迈视觉工具1.5</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body class="admin-page">
  <header class="admin-topbar">
    <div class="brand">
      <div class="brand-mark">AI</div>
      <div>
        <h1>后台管理</h1>
        <p>用户和 API 配置</p>
      </div>
    </div>
    <nav class="admin-nav">
      <a class="top-link" href="/">返回工具</a>
      <button id="adminLogoutBtn" class="top-link" type="button">退出</button>
    </nav>
  </header>

  <main class="admin-shell">
    <section id="securityNotice" class="admin-warning" hidden>
      默认管理员密码仍是 admin123。上线或给别人使用前，请在用户列表里给 admin 修改密码。
    </section>

    <nav class="admin-tabs" aria-label="后台功能">
      <button class="active" type="button" data-admin-tab="users">用户列表</button>
      <button type="button" data-admin-tab="applications">账号审核</button>
      <button type="button" data-admin-tab="create">添加用户</button>
      <button type="button" data-admin-tab="api">API 配置</button>
      <button type="button" data-admin-tab="usage">使用记录</button>
    </nav>

    <section class="admin-card admin-panel" data-admin-panel="api" hidden>
      <div class="panel-head">
        <h2>API 配置</h2>
        <span id="configStatus">未加载</span>
      </div>
      <div class="admin-grid">
        <label class="field">
          <span>API 地址</span>
          <input id="adminApiBaseUrl" placeholder="https://api.openai.com/v1">
        </label>
        <label class="field">
          <span>API Key</span>
          <input id="adminApiKey" type="password" placeholder="留空则不修改现有 Key">
        </label>
        <label class="field">
          <span>生图模型</span>
          <input id="adminImageModel" placeholder="gpt-image-2">
        </label>
        <label class="field">
          <span>LLM 分析模型</span>
          <input id="adminLlmModel" placeholder="gemini-3.1-pro-preview">
        </label>
      </div>
      <div class="admin-actions">
        <button id="saveAdminConfigBtn" class="primary-btn" type="button">保存 API 配置</button>
        <button id="testAdminConfigBtn" class="ghost-btn" type="button">测试连接</button>
      </div>
    </section>

    <section class="admin-card admin-panel" data-admin-panel="applications" hidden>
      <div class="panel-head">
        <h2>账号申请审核</h2>
        <span id="applicationCount">0 个待审核</span>
      </div>
      <div id="applicationsTable" class="admin-table"></div>
    </section>

    <section class="admin-card admin-panel" data-admin-panel="create" hidden>
      <div class="panel-head">
        <h2>添加用户</h2>
      </div>
      <div class="admin-grid user-create-grid">
        <label class="field">
          <span>账号</span>
          <input id="newUsername" placeholder="用户001">
        </label>
        <label class="field">
          <span>密码</span>
          <input id="newPassword" type="password" placeholder="至少 6 位">
        </label>
        <label class="field">
          <span>角色</span>
          <select id="newRole">
            <option value="user">普通用户</option>
            <option value="admin">管理员</option>
          </select>
        </label>
      </div>
      <div class="module-limit-grid">
        <label class="field"><span>提示词做图次数</span><input id="newLimitEdit" type="number" value="-1" min="-1"></label>
        <label class="field"><span>以图做图次数</span><input id="newLimitMain" type="number" value="-1" min="-1"></label>
        <label class="field"><span>产品开发次数</span><input id="newLimitDevelop" type="number" value="-1" min="-1"></label>
        <label class="field"><span>克隆详情次数</span><input id="newLimitClone" type="number" value="-1" min="-1"></label>
      </div>
      <p class="empty-note">次数填 -1 表示不限次，0 表示禁用该功能。</p>
      <button id="createUserBtn" class="primary-btn" type="button">添加用户</button>
    </section>

    <section class="admin-card admin-panel" data-admin-panel="users">
      <div class="panel-head">
        <h2>用户列表</h2>
        <label class="field compact-field">
          <span>查看用户</span>
          <select id="userFilter">
            <option value="all">全部用户</option>
          </select>
        </label>
      </div>
      <div id="usersTable" class="admin-table"></div>
    </section>

    <section class="admin-card admin-panel" data-admin-panel="usage" hidden>
      <div class="panel-head">
        <h2>最近使用记录</h2>
      </div>
      <div id="usageList" class="usage-list"></div>
    </section>
  </main>

  <script src="./admin.js"></script>
</body>
</html>
